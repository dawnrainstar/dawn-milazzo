<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline Field Mode – Ms. Heavy Metal Leaf</title>
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <style>
    body {
      background-color: #070b0e;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 2rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
      text-align: center;
    }
    .card {
      background: #0d151c;
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 1rem;
      padding: 2.5rem 2rem;
      max-width: 480px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }
    .badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      background: rgba(245, 158, 11, 0.2);
      border: 1px solid #f59e0b;
      color: #fbbf24;
      font-size: 0.75rem;
      font-family: monospace;
      margin-bottom: 1.5rem;
      letter-spacing: 0.05em;
    }
    h1 {
      font-size: 1.5rem;
      margin: 0 0 0.5rem 0;
      color: #f8fafc;
    }
    p {
      color: #94a3b8;
      font-size: 0.875rem;
      line-height: 1.6;
      margin: 0 0 1.5rem 0;
    }
    .reconnect-btn {
      background: #10b981;
      color: #022c22;
      border: none;
      font-weight: 600;
      font-size: 0.875rem;
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .reconnect-btn:hover {
      background: #34d399;
    }
    .quote {
      margin-top: 2rem;
      font-size: 0.8rem;
      font-style: italic;
      color: #64748b;
      border-left: 2px solid #10b981;
      padding-left: 0.75rem;
      text-align: left;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">OFFLINE SATELLITE MODE</div>
    <h1>Ms. Heavy Metal Leaf</h1>
    <p>
      Your device is currently disconnected from the global telemetry grid. 
      Local regional databases and autonomous swarm directives remain cached in browser storage.
    </p>
    <button class="reconnect-btn" onclick="window.location.reload()">
      Retry Telemetry Link
    </button>
    <div class="quote">
      "The river remembers. The seeds wait beneath the snow. Protect the roots."
    </div>
  </div>
</body>
</html>
